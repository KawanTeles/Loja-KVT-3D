    <meta charset="UTF-8">

    <title>Contato | KVT | Loja Oficial</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/pages/contato.css">
</head>

<body>
    <header>
        <div class="container header-content">
            <a href="../index.html" class="logo">KVT</a>
            <nav class="nav-menu">
                <a href="../index.html" class="nav-link">Home</a>
                <a href="../admin/" class="nav-link">Admin</a>
            </nav>
            <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema">
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="contact-main">
        <div class="container">
            <h1>Entre em Contato</h1>
            <p>Mande seu projeto personalizado!</p>

            <form class="contact-form" id="orcamento-form">
                <input type="text" id="contato-nome" placeholder="Seu Nome" required>
                <input type="email" id="contato-email" placeholder="Seu E-mail" required>
                <textarea id="contato-projeto" placeholder="Descreva seu projeto  (tamanho, cor, finalidade)..."
                    required></textarea>
                <button type="submit" class="btn btn-primary">Enviar via WhatsApp</button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase_config.js"></script>
    <script src="../js/script.js"></script>
